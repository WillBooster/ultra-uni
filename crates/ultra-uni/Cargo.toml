[package]
name = "ultra-uni"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tree-sitter = { package = "willbooster-tree-sitter", version = "=2.0.1" }
tree-sitter-c = { package = "willbooster-tree-sitter-c", version = "=5.0.0" }
tree-sitter-c-sharp = { package = "willbooster-tree-sitter-c-sharp", version = "=4.0.0" }
tree-sitter-cpp = { package = "willbooster-tree-sitter-cpp", version = "=3.0.0" }
tree-sitter-css = { package = "willbooster-tree-sitter-css", version = "=1.0.0" }
tree-sitter-dart = { package = "willbooster-tree-sitter-dart", version = "=1.0.0" }
tree-sitter-embedded-template = { package = "willbooster-tree-sitter-embedded-template", version = "=1.0.0" }
tree-sitter-haskell = { package = "willbooster-tree-sitter-haskell", version = "=1.0.0" }
tree-sitter-html = { package = "willbooster-tree-sitter-html", version = "=1.0.0" }
tree-sitter-java = { package = "willbooster-tree-sitter-java", version = "=2.0.0" }
tree-sitter-javascript = { package = "willbooster-tree-sitter-javascript", version = "=5.0.0" }
tree-sitter-kotlin = { package = "willbooster-tree-sitter-kotlin", version = "=5.0.0" }
tree-sitter-php = { package = "willbooster-tree-sitter-php", version = "=1.0.0" }
tree-sitter-python = { package = "willbooster-tree-sitter-python", version = "=2.0.0" }
tree-sitter-ruby = { package = "willbooster-tree-sitter-ruby", version = "=2.0.0" }
tree-sitter-rust = { package = "willbooster-tree-sitter-rust", version = "=3.0.0" }
tree-sitter-typescript = { package = "willbooster-tree-sitter-typescript", version = "=8.0.0" }
tree-sitter-zig = { package = "willbooster-tree-sitter-zig", version = "=1.0.0" }
wasm-bindgen = "=0.2.129"
